[package]
name = "chat-ui"
version = "0.1.0"
description = "A visual Chat UI for Codex threads"
authors = ["Chat UI"]
edition = "2021"
default-run = "chat-ui"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
url = "2"
tauri = { version = "2", features = [] }

